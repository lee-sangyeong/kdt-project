<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portfolio Viewer</title>
  <style>
    body{margin:0;background:#0d0f14;color:#e8eaf0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:grid;place-items:center}
    .loading{max-width:520px;padding:28px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:#13161e;text-align:center;line-height:1.7}
    .loading b{color:#8ea4ff}
  </style>
</head>
<body>
  <div class="loading"><b>Loading portfolio...</b><br>HTML portfolio is being prepared.</div>
  <script>
    function portfolioScrollSpy() {
      if (window.__portfolioScrollSpyReady) return;
      window.__portfolioScrollSpyReady = true;

      const navItems = Array.from(document.querySelectorAll('.sidenav .nav-item[href^="#"]'));
      if (!navItems.length) return;

      const linkById = new Map();
      navItems.forEach((item) => {
        const href = item.getAttribute('href') || '';
        const id = decodeURIComponent(href.slice(1));
        const target = id ? document.getElementById(id) : null;
        if (target) linkById.set(id, item);
        item.addEventListener('click', () => setActive(item), { passive: true });
      });

      const sections = Array.from(linkById.keys())
        .map((id) => document.getElementById(id))
        .filter(Boolean);
      if (!sections.length) return;

      function setActive(activeItem) {
        navItems.forEach((item) => {
          const isActive = item === activeItem;
          item.classList.toggle('active', isActive);
          item.setAttribute('aria-current', isActive ? 'true' : 'false');
        });
      }

      function updateActiveSection() {
        const triggerLine = Math.min(window.innerHeight * 0.36, 280);
        let activeItem = navItems[0];

        sections.forEach((section) => {
          const rect = section.getBoundingClientRect();
          if (rect.top <= triggerLine && rect.bottom > 80) {
            activeItem = linkById.get(section.id) || activeItem;
          }
        });

        if (activeItem) setActive(activeItem);
      }

      let ticking = false;
      function requestUpdate() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(() => {
          ticking = false;
          updateActiveSection();
        });
      }

      window.addEventListener('scroll', requestUpdate, { passive: true });
      window.addEventListener('resize', requestUpdate);
      window.addEventListener('hashchange', () => window.setTimeout(updateActiveSection, 80));
      updateActiveSection();
    }

    (async () => {
      const params = new URLSearchParams(location.hash.replace(/^#/, ''));
      const file = params.get('file');
      const allowed = /^[0-9a-zA-Z._-]+\.html$/.test(file || '');
      if (!allowed) {
        document.body.innerHTML = '<div class="loading"><b>Portfolio file is missing.</b></div>';
        return;
      }

      const match = location.search.match(/\/blob\/([0-9a-f]{40})\/kdt12-portfolio\/viewer\.html/i);
      const commit = match ? match[1] : 'master';
      const assetBase = `https://raw.githubusercontent.com/lee-sangyeong/kdt-project/${commit}/kdt12-portfolio/`;
      const rawUrl = `${assetBase}${file}`;
      const cssUrl = `${assetBase}style.css`;

      try {
        const [htmlResponse, cssResponse] = await Promise.all([
          fetch(rawUrl, { cache: 'no-store' }),
          fetch(cssUrl, { cache: 'no-store' })
        ]);
        if (!htmlResponse.ok) throw new Error(`HTML HTTP ${htmlResponse.status}`);
        if (!cssResponse.ok) throw new Error(`CSS HTTP ${cssResponse.status}`);

        const html = await htmlResponse.text();
        const css = await cssResponse.text();
        const parsed = new DOMParser().parseFromString(html, 'text/html');

        document.documentElement.lang = parsed.documentElement.lang || 'ko';
        document.title = parsed.title || document.title;
        document.head.innerHTML = parsed.head.innerHTML;

        const base = document.createElement('base');
        base.href = assetBase;
        document.head.prepend(base);

        document.querySelectorAll('link[rel~="stylesheet"]').forEach((link) => link.remove());
        const style = document.createElement('style');
        style.setAttribute('data-portfolio-inline-css', 'true');
        style.textContent = css;
        document.head.appendChild(style);

        const loading = document.querySelector('.loading');
        if (loading) loading.remove();
        Array.from(document.body.attributes).forEach((attr) => document.body.removeAttribute(attr.name));
        Array.from(parsed.body.attributes).forEach((attr) => document.body.setAttribute(attr.name, attr.value));
        Array.from(parsed.body.childNodes).forEach((node) => {
          document.body.appendChild(document.importNode(node, true));
        });

        window.__portfolioScrollSpyReady = false;
        portfolioScrollSpy();
      } catch (error) {
        document.body.innerHTML = `<div class="loading"><b>Portfolio load failed.</b><br>${String(error.message || error)}</div>`;
      }
    })();
  </script>
</body>
</html>
